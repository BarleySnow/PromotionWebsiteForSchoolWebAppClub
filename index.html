<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹앱개발반 동아리 홍보용 웹사이트 홈페이지</title>
    <style>

        * 
        {
            box-sizing: border-box;
        }

        body 
        {
            margin: 0;
            padding: 0;
            justify-content: center;
            align-items: center;
            background-color: #cccccc;
            overflow-x: hidden;
        }

        nav {
            width: 100%;
            background-color: #333333;
            color: white;
            text-align: center;
            padding: 5px 0;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        nav ul li {
            display: block;
            margin: 0;
            flex-shrink: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            white-space: nowrap;
            transition: 0.15s;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        .BannerBox {
            width: 100%;
            text-align: center;
            background-color: #ffffff;
        }

        .BannerImg {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: auto;
            margin: 0 auto;
        }

        .PresentationBox 
        {
            padding: 10px;
            text-align: center;
        }

        .BoothLocationBox 
        {
            display: inline-block;
            background: #b3b3b3;
            padding: 20px;
            border-radius: 10px;
            width: 700px;
            height: 450px;
            max-width: 100%;
            text-align: center;
            overflow: hidden;
        }
        
        .LocationImg 
        {
            float: left;
            width: 315px;
            height: 420px;
            max-width: 100%;
            object-fit: cover;
        }

        .PresentationText 
        {
            font-size: 16px;
            word-break: keep-all;
        }

        .SidePageImg 
        {
            width: 250px;
            height: 250px;
            max-width: 100%;
            object-fit: cover;
        }

        @media (max-width: 850px) 
        {
            nav {
                overflow-x: auto;
                white-space: nowrap;
            }
            nav ul {
                justify-content: flex-start;
                overflow-x: auto;
                padding:
                5px 15px;
                scrollbar-width: none;
            }
            nav ul::-webkit-scrollbar {
                display: none;
            }
            
            .BannerImg {
                width: 100%;
                height: auto;
                max-width: none;
            }

            .BoothLocationBox 
            {
                width: 100%;
                height: auto;
                min-height: 450px;
            }

            .LocationImg 
            {
                width: 45%;
                height: auto;
                max-height: 420px;
            }

            .PresentationText 
            {
                font-size: 15px;
            }

            .SidePageImg 
            {
                width: 220px;
                height: 220px;
            }
        }
        @media (max-width: 600px) 
        {
            body 
            {
                width: 100%;
                font-size: 14px;
            }

            nav {
                padding: 8px 0;
                overflow-x: auto;
                white-space: nowrap;
            }
            nav ul {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                gap: 18px;
                width: max-content;
                padding:
                4px 12px;
                margin: 0;
            }
            nav ul li {
                display: block;
                margin: 0;
                flex-shrink: 0;
            }
            nav ul li a {
                font-size: 14px;
            }

            .BannerBox {
                width: 100%;
                background-color: #aaaaaa;
            }

            .BannerImg {
                width: 100%;
                max-width: none;
                height: auto;
            }

            h1 
            {
                font-size: 25px;
                margin: 20px 10px 10px;
            }

            h2 
            {
                font-size: 20px;
                margin-left: 10px;
                margin-right: 10px;
            }
            
            .PresentationBox 
            {
                width: 100%;
                padding: 10px;
            }

            .BoothLocationBox 
            {
                display: block;
                width: 100%;
                height: auto;
                min-height: 0;
                padding: 12px;
                border-radius: 10px;
                overflow: hidden;
            }

            .LocationImg 
            {
                float: none;
                display: block;
                width: 100%;
                height: auto;
                max-height: none;
                margin: 0 auto 15px;
            }

            .PresentationText 
            {
                font-size: 14px;
                line-height: 1.6;
                margin: 10px 0;
                word-break: keep-all;
            }

            .SidePageImg  
            {
                display: block;
                width: min(250px, 80vw);
                height: auto;
                margin: 0 auto;
            }

        }

        @media (max-width: 400px) 
        {
            nav ul 
            {
                gap: 15px;
                margin-left: 10px;
                margin-right: 10px;
            }

            nav ul li a 
            {
                font-size: 13px;
            }

            h1 
            {
                font-size: 22px;
            }

            h2 
            {
                font-size: 18px;
            }

            .PresentationBox 
            {
                padding: 8px;
            }

            .BoothLocationBox 
            {
                padding: 10px;
            }

            .PresentationText 
            {
                font-size: 13px;
                line-height: 1.6;
            }

            .SidePageImg 
            {
                width: 75vw;
            }
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">홈</a></li>
            <li><a href="Html/SeoulItWebAppDevelopmentClubExampleSidePage.html">예시 연결사이트(템플릿)</a></li>
            <li><a href="Html/SeoulItPromotionWebAppDevelopmentClubArtwork.html">웹앱개발반 작품</a></li>
            <li><a href="Html/SeoulItPromotionGameDevelopmentClubArtwork.html">게임개발반 작품</a></li>
        </ul>
    </nav>
    <div class="BannerBox">
        <img src="Html/Image/BannerImg.png" class="BannerImg" alt="배너사진">
    </div>
    <h1>부스 운영시간</h1>
    <br>
    <div class="PresentationBox">
        <div class="BoothLocationBox">
            <img src="Html/Image/BoothLocationImg.png" class="LocationImg" alt="부스 위치사진">
            <p class="PresentationText">
                안녕하세요 이것은 예시 작성문 입니다.<br>
                그래서 중요한 내용은 적혀있지 않으니 넘어가주십시오.<br>
                그럼에도 궁금하신 점이 있다면 그냥 가세요.
            </p>
        </div>
        <br>
        <h1>부스내 게임작품 목록</h1>
        <br><br><br><br><br>
        <h2>1. 예시 연결사이트(템플릿)</h2>
        <a href="Html/SeoulItWebAppDevelopmentClubExampleSidePage.html">
            <img src="Html/Image/TestImg.jpg" class="SidePageImg" alt="홍보페이지 이미지">
        </a>
        <br><br><br>
        <h2>2. 웹앱개발반 작품</h2>
        <a href="Html/SeoulItPromotionWebAppDevelopmentClubArtwork.html">
            <img src="Html/Image/TestImg.jpg" class="SidePageImg" alt="홍보페이지 이미지">
        </a>
        <br><br><br>
        <h2>3. 게임개발반 작품</h2>
        <a href="Html/SeoulItPromotionGameDevelopmentClubArtwork.html">
            <img src="Html/Image/TestImg.jpg" class="SidePageImg" alt="홍보페이지 이미지">
        </a>
    </div>
</body>
</html>
