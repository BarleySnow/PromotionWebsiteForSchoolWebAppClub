<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹앱개발반 연결사이트 템플릿</title>
    <style>
        /* =========================================
           기본 설정
        ========================================= */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background:
            radial-gradient(
                circle at top,
                #444444 0%,
                #333333 50%,
                #222222 100%
            );
            color: #d6d7d8;
            font-family:
            Arial,
            Helvetica,
            sans-serif;
        }

        nav {
            background-color: #333333;
            color: white;
            text-align: center;
            padding: 5px 0;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* =========================================
           전체 페이지
        ========================================= */
        .page {
            width: 1200px;
            max-width: 95%;
            margin: 35px auto 60px;
        }
        /* =========================================
           게임 제목
        ========================================= */
        .game-title {
            font-size: 30px;
            color: white;
            margin-bottom: 15px;
        }
        /* =========================================
           왼쪽 슬라이드쇼 + 오른쪽 정보
        ========================================= */
        .game-content {
            display: grid;
            grid-template-columns:
            minmax(0, 2.1fr)
            minmax(280px, 1fr);
            gap: 15px;
        }
        /* =========================================
           슬라이드쇼
        ========================================= */
        .gallery {
            min-width: 0;
        }
        /* =========================================
           큰 이미지
        ========================================= */
        .main-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        /* 이미지 변경할 때 잠깐 투명 */
        .main-image.fade {
            opacity: 0;
        }
        /* =========================================
           재생 버튼
        ========================================= */
        .play-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform:
            translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 50%;
            background:
            rgba(20, 30, 40, 0.9);
            color: white;
            font-size: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-button:hover {
            background:
            rgba(60, 100, 135, 0.95);
            transform:
            translate(-50%, -50%)
            scale(1.08);
        }
        /* =========================================
           썸네일 전체 영역
        ========================================= */
        .thumbnail-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 7px;
        }
        /* =========================================
           좌우 버튼
        ========================================= */
        .slide-button {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border: none;
            border-radius: 2px;
            background: #555555;
            color: #b8d5e8;
            font-size: 18px;
            cursor: pointer;
            transition: 0.15s;
        }
        .slide-button:hover {
            background: #777777;
            color: white;
        }
        /* =========================================
           썸네일 목록
        ========================================= */
        .thumbnail-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 1;
            min-width: 0;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        /* Chrome, Edge, Safari에서 스크롤바 숨기기 */
        .thumbnail-list::-webkit-scrollbar {
            display: none;
        }
        /* =========================================
           썸네일
        ========================================= */
        .thumbnail {
            width: 115px;
            height: 65px;
            flex-shrink: 0;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.55;
            border: 2px solid transparent;
            transition:
            opacity 0.15s,
            border 0.15s,
            transform 0.15s;
        }
        .thumbnail:hover {
            opacity: 1;
            transform:
            translateY(-1px);
        }
        /* 현재 선택된 썸네일 */
        .thumbnail.active {
            opacity: 1;
            border:
            3px solid #eeeeee;
        }
        /* =========================================
           오른쪽 게임 정보
        ========================================= */
        .game-info {
            min-width: 0;
        }
        /* =========================================
           게임 로고
        ========================================= */
        .game-logo {
            width: 100%;
            height: 175px;
            object-fit: cover;
            display: block;
            margin-bottom: 14px;
        }
        /* =========================================
           게임 설명
        ========================================= */
        .description {
            color: #dddddd;
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 25px;
        }
        /* =========================================
           게임 정보
        ========================================= */
        .info-row {
            display: grid;
            grid-template-columns: 135px 1fr;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .info-label {
            color: #999999;
        }
        .info-value {
            color: #bbbbbb;
        }
        /* =========================================
           반응형
        ========================================= */
        @media (max-width: 850px) {
            .game-content {
                grid-template-columns: 1fr;
            }
            .game-logo {
                height: 220px;
            }
        }
        @media (max-width: 600px) {
            .page {
                max-width: 100%;
                margin-top: 20px;
            }
            .game-title {
                padding-left: 10px;
            }
            .thumbnail {
                width: 90px;
                height: 52px;
            }
            .slide-button {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">홈</a></li>
            <li><a href="SeoulItWebAppExampleSidePage.html">예시 연결사이트(템플릿)</a></li>
            <li><a href="index.html">빈 연결사이트1</a></li>
            <li><a href="index.html">빈 연결사이트2</a></li>
        </ul>
    </nav>

    <div class="page">
        <!-- =====================================
             게임 제목
        ====================================== -->
        <div class="game-title">
            Example Game Title
        </div>
        <!-- =====================================
             메인 콘텐츠
        ====================================== -->
        <div class="game-content">
            <!-- =================================
                 왼쪽 : 슬라이드쇼
            ================================== -->
            <div class="gallery">
                <!-- 큰 이미지 -->
                <div class="main-image-container">
                    <img
                        id="mainImage"
                        class="main-image"
                        src="Image/1.png"
                        alt="Example Game Title Image"
                    >
                    <!-- 재생 버튼 -->
                    <button
                        id="playButton"
                        class="play-button"
                        onclick="playVideo()"
                    >
                        ▶
                    </button>
                </div>
                <!-- =================================
                     썸네일
                ================================== -->
                <div class="thumbnail-wrapper">
                    <!-- 이전 버튼 -->
                    <button
                        class="slide-button"
                        onclick="previousImage()"
                    >
                        ◀
                    </button>
                    <!-- 썸네일 목록 -->
                    <div
                        id="thumbnailList"
                        class="thumbnail-list"
                    >
                        <img
                            class="thumbnail active"
                            src="Image/1.png"
                            onclick="changeImage(0)"
                            alt="이미지 1"
                        >
                        <img
                            class="thumbnail"
                            src="Image/2.png"
                            onclick="changeImage(1)"
                            alt="이미지 2"
                        >
                        <img
                            class="thumbnail"
                            src="Image/3.png"
                            onclick="changeImage(2)"
                            alt="이미지 3"
                        >
                        <img
                            class="thumbnail"
                            src="Image/4.png"
                            onclick="changeImage(3)"
                            alt="이미지 4"
                        >
                        <img
                            class="thumbnail"
                            src="Image/5.png"
                            onclick="changeImage(4)"
                            alt="이미지 5"
                        >
                        <img
                            class="thumbnail"
                            src="Image/6.png"
                            onclick="changeImage(5)"
                            alt="이미지 6"
                        >
                        <img
                            class="thumbnail"
                            src="Image/7.png"
                            onclick="changeImage(6)"
                            alt="이미지 7"
                        >
                    </div>
                    <!-- 다음 버튼 -->
                    <button
                        class="slide-button"
                        onclick="nextImage()"
                    >
                        ▶
                    </button>
                </div>
            </div>
            <!-- =================================
                 오른쪽 : 게임 정보
            ================================== -->
            <div class="game-info">
                <!-- 게임 로고 -->
                <img
                    class="game-logo"
                    src="Image/BannerImg.png"
                    alt="Example Game Title"
                >
                <!-- 게임 설명 -->
                <div class="description">
                    Example Game Description
                </div>
                <!-- 출시일 -->
                <div class="info-row">
                    <div class="info-label">
                        RELEASE DATE:
                    </div>
                    <div class="info-value">
                        2026, Sep 08 
                    </div>
                </div>
                <!-- 개발자 -->
                <div class="info-row">
                    <div class="info-label">
                        DEVELOPER:
                    </div>
                    <div class="info-value">
                        Example Developer Name
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        /* =========================================
           슬라이드 이미지 목록
        ========================================= */
        const images = [
            "Image/1.png",
            "Image/2.png",
            "Image/3.png",
            "Image/4.png",
            "Image/5.png",
            "Image/6.png",
            "Image/7.png"
        ];
        /* =========================================
           현재 이미지 번호
        ========================================= */
        let currentIndex = 0;
        /* =========================================
           HTML 요소 가져오기
        ========================================= */
        const mainImage =
            document.getElementById("mainImage");
        const thumbnails =
            document.querySelectorAll(".thumbnail");
        const playButton =
            document.getElementById("playButton");
        /* =========================================
           이미지 변경
        ========================================= */
        function changeImage(index) {
            currentIndex = index;
            /* ==============================
            메인 이미지 페이드 아웃
            ============================== */
            mainImage.classList.add("fade");
            setTimeout(function() {
                mainImage.src = images[currentIndex];
                mainImage.classList.remove("fade");
            }, 150);
            /* ==============================
            모든 썸네일의 active 제거
            ============================== */
            thumbnails.forEach(function(thumbnail) {
                thumbnail.classList.remove("active");
            });
            /* ==============================
            현재 썸네일 활성화
            ============================== */
            const currentThumbnail =
                thumbnails[currentIndex];
            currentThumbnail.classList.add("active");
            /* ==============================
            ★ 현재 썸네일이 안 보이면
                자동으로 슬라이드바 이동
            ============================== */
            currentThumbnail.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
            });
            /* ==============================
            첫 번째 이미지만 재생 버튼 표시
            ============================== */
            if (currentIndex === 0) {
                playButton.style.display = "block";
            }
            else {
                playButton.style.display = "none";
            }
        }
        /* =========================================
           이전 이미지
        ========================================= */
        function previousImage() {
            currentIndex--;
            /* 첫 번째에서 이전으로 가면 마지막으로 */
            if (currentIndex < 0) {
                currentIndex =
                    images.length - 1;
            }
            changeImage(currentIndex);
        }
        /* =========================================
           다음 이미지
        ========================================= */
        function nextImage() {
            currentIndex++;
            /* 마지막에서 다음으로 가면 처음으로 */
            if (
                currentIndex >= images.length
            ) {
                currentIndex = 0;
            }
            changeImage(currentIndex);
        }
        /* =========================================
           재생 버튼
        ========================================= */
        function playVideo() {
            alert(
                "여기에 게임 트레일러 영상을 넣을 수 있습니다."
            );
        }
        /* =========================================
           키보드 조작
        ========================================= */
        document.addEventListener(
            "keydown",
            function(event) {
                /* 왼쪽 방향키 */
                if (
                    event.key === "ArrowLeft"
                ) {
                    previousImage();
                }
                /* 오른쪽 방향키 */
                if (
                    event.key === "ArrowRight"
                ) {
                    nextImage();
                }
            }
        );
    </script>
</body>
</html>
